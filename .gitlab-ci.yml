stages:
  - build
  - test
  - package
  - deploy

variables:
  DOCKER_IMAGE_NAME: "my-app"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA" # Уникальный тег вместо latest (пункт 4 best practices)

build_app:
  stage: build
  image: alpine:latest
  script:
    - echo "🔨 Сборка приложения..."
    - echo "Имитация сборки (mvn build, npm install, etc.)"
    - echo "Сборка завершена успешно"
  artifacts:
    paths:
      - build_output/
    expire_in: 1 week

run_unit_tests:
  stage: test
  image: alpine:latest
  script:
    - echo "🧪 Запуск unit-тестов..."
    - echo "Все тесты пройдены успешно"
  needs: ["build_app"]

run_lint_tests:
  stage: test
  image: alpine:latest
  script:
    - echo "📏 Запуск линтера..."
    - echo "Проверка кода завершена"
  needs: ["build_app"]

build_docker_image:
  stage: package
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "🐳 Сборка Docker-образа..."
    - echo "Имитация сборки образа: $DOCKER_IMAGE_NAME:$DOCKER_TAG"
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_TAG .
    - echo "Образ собран успешно"
  only:
    - main
    - master
    - develop

deploy_to_staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🚀 Деплой на staging-окружение..."
    - echo "Имитация деплоя (scp, kubectl apply, ansible-playbook, etc.)"
    - echo "Деплой завершен успешно"
  environment:
    name: staging
    url: https://staging.example.com
  when: manual # Требует ручного подтверждения (best practice)
  needs: ["build_docker_image"]

deploy_to_production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "🏭 Деплой на production..."
    - echo "Внимание! Это production-окружение"
    - echo "Деплой на production завершен"
  environment:
    name: production
    url: https://example.com
  when: manual
  only:
    - main
    - master
  needs: ["deploy_to_staging"]
